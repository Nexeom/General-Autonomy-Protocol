name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.13"
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest tests/ -q --cov=gap_kernel --cov-report=term-missing --cov-fail-under=90

  quickstart:
    name: README quickstart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Runs the exact commands the README tells a new user to run. If this
      # job fails, the documented install path is broken.
      - name: Install as documented
        run: pip install -e ".[dev]"

      - name: Run governed quickstart
        run: python examples/governed_demo.py

  lint:
    name: lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install ruff mypy

      - name: Ruff
        run: ruff check gap_kernel/ tests/ examples/ tools/

      - name: Mypy
        run: mypy gap_kernel/ --ignore-missing-imports
        continue-on-error: true

  release-build:
    name: Reproducible alpha artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hash-locked build tools
        run: python -m pip install --require-hashes -r requirements/build-py312.txt
      - name: Build twice and verify
        run: |
          python tools/build_release.py --output-dir "$RUNNER_TEMP/gap-release"
          python tools/build_release.py --verify "$RUNNER_TEMP/gap-release"
      - uses: actions/upload-artifact@v4
        with:
          name: reproducible-alpha
          path: ${{ runner.temp }}/gap-release/
