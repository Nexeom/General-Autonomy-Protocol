[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gap-kernel"
version = "0.3.0a1"
description = "General Autonomy Protocol — Kernel Implementation"
authors = [{name = "Nexeom"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "croniter>=2.0,<7",
    "cryptography>=42.0,<47",
]

[project.optional-dependencies]
gateway = ["fastapi>=0.110,<1.0", "uvicorn>=0.27,<1.0", "httpx>=0.27,<1.0"]
langgraph = ["langgraph>=1.0,<2", "httpx>=0.27,<1.0"]
# The REST surface is optional: the governance kernel core runs without it.
api = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
]
dev = [
    "gap-kernel[api]",
    "gap-kernel[gateway,langgraph]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    # CONTRIBUTING requires `ruff check gap_kernel/ tests/` to pass, so the
    # documented install path has to supply it.
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Nexeom/General-Autonomy-Protocol"
Repository = "https://github.com/Nexeom/General-Autonomy-Protocol"
Issues = "https://github.com/Nexeom/General-Autonomy-Protocol/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["gap_kernel"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pyflakes catches undefined names and unused imports — the class of defect a
# governance kernel cannot afford to ship. Style rules stay advisory for now.
select = ["E9", "F"]

[tool.setuptools.packages.find]
include = ["gap_kernel*"]
